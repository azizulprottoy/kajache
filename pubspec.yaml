name: kaj_ache
description: "kaj ache! kaj ache . ."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.3+3

environment:
  sdk: ^3.9.2



dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # ── State Management ──────────────────────────────────────────────────────
  get: ^4.6.6

  # ── Networking ────────────────────────────────────────────────────────────
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # ── Storage ───────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.0.0
  get_storage: ^2.1.1

  # ── Maps & Location ───────────────────────────────────────────────────────
  flutter_map: ^8.2.2
  flutter_map_tile_switcher: ^0.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2

  # ── Images ────────────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # ── UI ────────────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  carousel_slider: ^4.2.1
  pin_code_fields: ^8.0.1        # OTP input
  intl: 0.20.2                 # date & currency formatting

  # ── Chat ─────────────────────────────────────────────────────────────────
  socket_io_client: ^2.0.3+1

  # ── Notifications ─────────────────────────────────────────────────────────
#  firebase_core: ^2.27.0
#  firebase_messaging: ^14.7.20
#  flutter_local_notifications: ^17.0.0

  # ── Utils ─────────────────────────────────────────────────────────────────
  intl_phone_field: ^3.2.0       # phone number input with country code
  url_launcher: ^6.2.5
  webview_flutter: 4.10.0        # in-app web pages (terms, privacy)
  share_plus: ^7.2.2
  permission_handler: ^11.3.0
  flutter_animate: ^4.5.0        # smooth animations
  flutter_html: ^3.0.0-beta.2   # render HTML descriptions
  html_editor_enhanced: ^2.6.0  # rich text (HTML) authoring for description fields
  flutter_launcher_icons: ^0.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700